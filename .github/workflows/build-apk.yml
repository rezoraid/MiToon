name: Build APK

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write   # perlu untuk melampirkan APK ke Release

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # Boleh kosong: build.gradle.kts jatuh kembali ke nilai di gradle.properties
      API_BASE_URL: ${{ vars.API_BASE_URL }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Siapkan keystore rilis (hanya jika secret ada)
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/mitoon.jks"
            echo "KEYSTORE_PATH=$RUNNER_TEMP/mitoon.jks" >> "$GITHUB_ENV"
            echo "Keystore rilis dipasang."
          else
            echo "KEYSTORE_BASE64 kosong: APK ditandatangani debug key."
          fi

      - name: Build release
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          chmod +x gradlew
          ARGS=(assembleRelease --no-daemon --stacktrace
                -PVERSION_CODE="${{ github.run_number }}")
          # Kirim -PAPI_BASE_URL hanya bila variable terisi (kosong akan menimpa gradle.properties)
          if [ -n "${API_BASE_URL// }" ]; then ARGS+=(-PAPI_BASE_URL="$API_BASE_URL"); fi
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then ARGS+=(-PVERSION_NAME="${GITHUB_REF_NAME#v}"); fi
          ./gradlew "${ARGS[@]}"

      - name: Hapus keystore dari runner
        if: always()
        run: rm -f "$RUNNER_TEMP/mitoon.jks"

      - uses: actions/upload-artifact@v4
        with:
          name: MiToon-apk
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error

      - name: Lampirkan ke Release (tag v*)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: app/build/outputs/apk/release/*.apk
          
