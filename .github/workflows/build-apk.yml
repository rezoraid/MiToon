name: Build APK

on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
    inputs:
      api_base_url:
        description: 'URL backend, diakhiri "/" (kosong = pakai default)'
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: build-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      API_BASE_URL: ${{ inputs.api_base_url || vars.API_BASE_URL || 'https://crot-theta.vercel.app/' }}
      KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
      KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
      KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

    steps:
      - uses: actions/checkout@v4

      - name: Validasi API_BASE_URL
        run: |
          case "$API_BASE_URL" in http://*|https://*) ;; *) echo "::error::API_BASE_URL harus diawali http:// atau https://"; exit 1 ;; esac
          case "$API_BASE_URL" in */) ;; *) echo "::error::API_BASE_URL harus diakhiri '/'"; exit 1 ;; esac

      - name: Tentukan versi
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then V="${GITHUB_REF_NAME#v}"; else V="1.0.${GITHUB_RUN_NUMBER}"; fi
          echo "VERSION_NAME=$V" >> "$GITHUB_ENV"
          echo "VERSION_CODE=${GITHUB_RUN_NUMBER}" >> "$GITHUB_ENV"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4

      - name: Siapkan keystore rilis (opsional)
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
          else
            echo "::warning::KEYSTORE_BASE64 tidak ada: APK ditandatangani debug key."
          fi

      - name: Build APK rilis
        run: |
          chmod +x ./gradlew
          ./gradlew assembleRelease --stacktrace \
            -PAPI_BASE_URL="$API_BASE_URL" \
            -PVERSION_CODE="$VERSION_CODE" \
            -PVERSION_NAME="$VERSION_NAME"
          cp app/build/outputs/apk/release/app-release.apk "MiToon-${VERSION_NAME}.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: MiToon-apk
          path: MiToon-*.apk
          retention-days: 30
          if-no-files-found: error

      - name: Lampirkan ke GitHub Release (tag v*)
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" "MiToon-${VERSION_NAME}.apk" --title "MiToon $VERSION_NAME" --generate-notes
