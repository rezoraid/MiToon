name: Build APK

on:
  push:
    branches: [main, master]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write   # perlu untuk melampirkan APK ke Releases

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      API_BASE_URL: ${{ vars.API_BASE_URL }}
      KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
      KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
      KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
      KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle (cache)
        uses: gradle/actions/setup-gradle@v4

      - name: Izinkan gradlew dieksekusi
        run: chmod +x ./gradlew

      - name: Siapkan keystore (opsional)
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/mitoon.jks"
            echo "KEYSTORE_PATH=$RUNNER_TEMP/mitoon.jks" >> "$GITHUB_ENV"
            echo "Keystore rilis dipakai."
          else
            echo "Tidak ada KEYSTORE_BASE64, APK ditandatangani debug key."
          fi

      - name: Tentukan versi & API URL
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "VERSION_NAME=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
          else
            echo "VERSION_NAME=1.0.${GITHUB_RUN_NUMBER}" >> "$GITHUB_ENV"
          fi
          echo "VERSION_CODE=${GITHUB_RUN_NUMBER}" >> "$GITHUB_ENV"
          # Pakai nilai default di gradle.properties kalau variable kosong
          if [ -n "$API_BASE_URL" ]; then
            case "$API_BASE_URL" in */) ;; *) API_BASE_URL="$API_BASE_URL/" ;; esac
            echo "GRADLE_API_ARG=-PAPI_BASE_URL=$API_BASE_URL" >> "$GITHUB_ENV"
          else
            echo "GRADLE_API_ARG=" >> "$GITHUB_ENV"
          fi

      - name: Build APK release
        run: >
          ./gradlew assembleRelease --stacktrace --no-daemon
          -PVERSION_CODE="$VERSION_CODE"
          -PVERSION_NAME="$VERSION_NAME"
          $GRADLE_API_ARG

      - name: Rename APK
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk "dist/MiToon-${VERSION_NAME}.apk"
          ls -lh dist

      - name: Upload APK (Artifacts)
        uses: actions/upload-artifact@v4
        with:
          name: MiToon-apk
          path: dist/*.apk
          if-no-files-found: error

      - name: Lampirkan ke GitHub Release (tag v*)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.apk
          generate_release_notes: true
